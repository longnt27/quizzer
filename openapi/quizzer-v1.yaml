openapi: 3.1.0
info:
  title: Quizzer Local Service API
  version: 1.0.0
  description: Authenticated loopback API shared by the Quizzer desktop app and CLI.
servers:
  - url: http://127.0.0.1:8787/api/v1
security:
  - bearerToken: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service and storage health
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /capabilities:
    get:
      operationId: getCapabilities
      summary: Inspect hardware and available service capabilities
      responses:
        '200':
          description: Capability snapshot
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, hardware, providers, providerPolicies, operations]
                properties:
                  apiVersion: { type: integer, const: 1 }
                  hardware: { $ref: '#/components/schemas/HardwareCapabilities' }
                  providers: { type: array, items: { type: string } }
                  providerPolicies:
                    type: object
                    additionalProperties:
                      type: object
                      required: [billing, privacy, maxConcurrency]
                      properties:
                        billing: { type: string, enum: [local, account, usage-based] }
                        privacy: { type: string, enum: [local, signed-in-agent, remote-api] }
                        maxConcurrency: { type: integer, minimum: 1, maximum: 10 }
                  operations: { type: array, items: { type: string } }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings/schema:
    get:
      operationId: getSettingsSchema
      summary: Read settings JSON Schema and UI metadata
      responses:
        '200':
          description: Settings contract
          content:
            application/json:
              schema:
                type: object
                required: [schema, registry, profiles]
                properties:
                  schema: { type: object }
                  registry: { type: array, items: { type: object } }
                  profiles:
                    type: object
                    required: [lite, balanced, max]
                    properties:
                      lite: { type: object, additionalProperties: true }
                      balanced: { type: object, additionalProperties: true }
                      max: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings:
    get:
      operationId: getSettings
      summary: Resolve effective settings with provenance
      parameters:
        - in: query
          name: profile
          schema: { type: string, enum: [lite, balanced, max] }
      responses:
        '200':
          description: Resolved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateSettings
      summary: Update or reset user setting overrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values: { type: object, additionalProperties: true }
                unset: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated effective settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedSettings'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /integrations/llama-cpp/configure:
    post:
      operationId: configureLlamaCpp
      summary: Confirm and persist a local llama.cpp endpoint and model
      description: Only unauthenticated HTTP loopback endpoints are accepted. Quizzer does not download models as part of this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, model, confirmed]
              properties:
                endpoint: { type: string, format: uri, pattern: '^http://(?:127\\.|\\[::1\\])' }
                model: { type: string, minLength: 1, maxLength: 200 }
                confirmed: { type: boolean, const: true }
      responses:
        '200':
          description: Configuration saved and effective settings returned
          content:
            application/json:
              schema: { type: object, required: [ok, settings], properties: { ok: { type: boolean }, settings: { $ref: '#/components/schemas/ResolvedSettings' } } }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /provider-credentials:
    get:
      operationId: getProviderCredentialStatus
      summary: List API providers with an in-memory or environment credential, never credential values
      responses:
        '200':
          description: Configured provider names
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    uniqueItems: true
                    items: { type: string, enum: [gemini, anthropic, openai, openrouter, deepseek, openai-compatible] }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: replaceProviderCredentials
      summary: Replace volatile provider credentials used by service-owned jobs
      description: Values remain in service memory only and are excluded from settings, logs, backups, and diagnostics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: false
                  properties:
                    gemini: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
                    anthropic: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
                    openai: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
                    openrouter: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
                    deepseek: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
                    openai-compatible: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
      responses:
        '200':
          description: Configured provider names, without values
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /onboarding:
    get:
      operationId: getOnboarding
      summary: Read the durable default application profile and onboarding state
      responses:
        '200':
          description: Stored profile
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/ApplicationProfile' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateOnboarding
      summary: Update onboarding progress on the default application profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onboarding]
              properties:
                onboarding: { $ref: '#/components/schemas/OnboardingState' }
      responses:
        '200':
          description: Updated profile
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /migrations:
    get:
      operationId: listMigrations
      summary: List verified legacy browser imports and their rollback backups
      responses:
        '200':
          description: Migration history
          content:
            application/json:
              schema:
                type: object
                required: [migrations]
                properties:
                  migrations:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegacyMigration'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /backups:
    get:
      operationId: listBackups
      summary: List service-managed library backups and manifest status
      responses:
        '200':
          description: Backup collection
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups: { type: array, items: { $ref: '#/components/schemas/BackupSummary' } }
    post:
      operationId: createBackup
      summary: Create a verified backup of authoritative data and content objects
      responses:
        '201': { description: Created backup and integrity manifest }
  /backups/{backupId}:
    parameters:
      - in: path
        name: backupId
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,160}$' }
    get:
      operationId: verifyBackup
      summary: Re-hash and verify every file in a service-managed backup
      responses:
        '200': { description: Verified backup and integrity manifest }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /plugins/schema:
    get:
      operationId: getPluginManifestSchema
      summary: Read the versioned plugin manifest JSON Schema
      responses:
        '200': { description: Plugin manifest schema }
  /plugins/registry:
    get:
      operationId: listRegistryPlugins
      summary: List signed plugins available in the remote registry catalog
      responses:
        '200':
          description: Available registry plugins
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items: { $ref: '#/components/schemas/RegistryPluginSummary' }
  /plugins:
    get:
      operationId: listPlugins
      summary: List built-in components and installed external plugins
      parameters:
        - in: query
          name: registry
          schema: { type: boolean }
          description: When true, return available remote registry plugins instead of installed plugins
      responses:
        '200':
          description: Plugin collection
          content:
            application/json:
              schema:
                type: object
                required: [builtIn, plugins]
                properties:
                  builtIn: { type: array, items: { $ref: '#/components/schemas/PluginSummary' } }
                  plugins: { type: array, items: { $ref: '#/components/schemas/PluginSummary' } }
  /plugins/install:
    post:
      operationId: installPlugin
      summary: Install or update a verified local plugin directory or remote registry plugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [path]
                  properties:
                    path: { type: string, minLength: 1, maxLength: 4096 }
                - type: object
                  additionalProperties: false
                  required: [id]
                  properties:
                    id: { type: string, minLength: 1, pattern: '^[a-z0-9](?:[a-z0-9.-]{0,126}[a-z0-9])?$' }
                    confirmed: { type: boolean, default: false }
                    confirmationToken: { type: string, pattern: '^[a-f0-9]{64}$' }
                  allOf:
                    - if:
                        required: [confirmed]
                        properties: { confirmed: { const: true } }
                      then: { required: [confirmationToken] }
                    - if: { required: [confirmationToken] }
                      then:
                        required: [confirmed]
                        properties: { confirmed: { const: true } }
      responses:
        '201': { description: Installed plugin }
        '400':
          description: Invalid request or security confirmation required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/PluginConfirmationRequired'
  /plugins/{pluginId}/{action}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [enable, disable, health, rollback, update] }
    post:
      operationId: managePlugin
      summary: Enable, disable, health-check, update, or roll back a plugin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirmed: { type: boolean, default: false }
                confirmationToken: { type: string, pattern: '^[a-f0-9]{64}$' }
              allOf:
                - if:
                    required: [confirmed]
                    properties: { confirmed: { const: true } }
                  then: { required: [confirmationToken] }
                - if: { required: [confirmationToken] }
                  then:
                    required: [confirmed]
                    properties: { confirmed: { const: true } }
      responses:
        '200': { description: Plugin lifecycle result }
        '400':
          description: Invalid request or security confirmation required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/PluginConfirmationRequired'
  /plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    delete:
      operationId: removePlugin
      summary: Move an installed plugin to recoverable removed storage
      parameters:
        - in: query
          name: confirm
          required: true
          schema: { type: boolean, const: true }
      responses:
        '200': { description: Recoverable removal result }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /documents:
    get:
      operationId: listDocuments
      summary: List document metadata without source bodies
      responses:
        '200':
          description: Document summaries
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
  /objects/{sha256}:
    parameters:
      - $ref: '#/components/parameters/ObjectSha256'
    put:
      operationId: putObject
      summary: Store an immutable binary object after verifying its SHA-256 id
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored or deduplicated object reference
          content:
            application/json:
              schema:
                type: object
                required: [object]
                properties:
                  object: { $ref: '#/components/schemas/StoredObjectReference' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
    get:
      operationId: getObject
      summary: Stream an immutable binary object
      responses:
        '200':
          description: Stored binary content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
    head:
      operationId: inspectObject
      summary: Check an immutable object and its byte size without downloading it
      responses:
        '200': { description: Object exists }
        '404': { $ref: '#/components/responses/NotFound' }
  /objects/status:
    get:
      operationId: getObjectStoreStatus
      summary: Inspect content-addressed storage usage and reference counts
      responses:
        '200':
          description: Object storage usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStoreStatus' }
  /objects/unreferenced:
    delete:
      operationId: pruneUnreferencedObjects
      summary: Remove unreferenced objects after a safety retention period
      parameters:
        - in: query
          name: confirm
          required: true
          schema: { type: boolean, const: true }
        - in: query
          name: minimumAgeHours
          schema: { type: number, minimum: 0, maximum: 8760, default: 24 }
      responses:
        '200': { description: Reclaimed object summary }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      summary: Read a document and its extracted content
      responses:
        '200': { description: Stored document }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteDocument
      summary: Delete a document
      responses:
        '200': { $ref: '#/components/responses/Okay' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{documentId}/reextract:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: reextractDocument
      summary: Re-extract a verified original and rebuild its retrieval index
      responses:
        '200':
          description: Updated document provenance and completed durable indexing job
          content:
            application/json:
              schema:
                type: object
                required: [document, job]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  job: { $ref: '#/components/schemas/IndexJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /index/status:
    get:
      operationId: getIndexStatus
      summary: Inspect the durable sparse and rebuildable dense indexes
      responses:
        '200':
          description: Sparse and dense index status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexStatus' }
  /index:
    post:
      operationId: indexDocuments
      summary: Start a durable, resumable sparse and configured dense indexing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentIds: { type: array, items: { type: string } }
                force: { type: boolean, default: false }
                idempotencyKey: { type: string, pattern: '^[A-Za-z0-9._-]{8,100}$' }
                wait: { type: boolean, default: true }
      responses:
        '200': { description: Documents indexed and the completed durable job }
        '202': { description: Durable indexing job accepted and running asynchronously }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /index/jobs:
    get:
      operationId: listIndexJobs
      summary: List durable indexing jobs and per-document checkpoints
      responses:
        '200':
          description: Indexing jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/IndexJob' } }
  /index/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getIndexJob
      summary: Read one indexing job and its durable checkpoints
      responses:
        '200': { description: Indexing job }
        '404': { $ref: '#/components/responses/NotFound' }
  /index/jobs/{jobId}/resume:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: resumeIndexJob
      summary: Resume only unfinished documents in a failed or cancelled indexing job
      responses:
        '202': { description: Indexing job queued for resumption }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /index/jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelIndexJob
      summary: Cancel indexing at the next per-document checkpoint
      responses:
        '200': { description: Indexing job cancelled }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /retrieval/preview:
    post:
      operationId: previewRetrieval
      summary: Preview scoped sparse or hybrid retrieval with stable source citations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1 }
                documentIds: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
                contextBudget: { type: integer, minimum: 256, maximum: 65536 }
                includeNeighbors: { type: boolean, default: true }
      responses:
        '200':
          description: Ranked retrieval evidence or a clear refusal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrievalPreview' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /jobs:
    get:
      operationId: listJobs
      summary: List durable generation jobs and their checkpoints
      responses:
        '200':
          description: Generation jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/GenerationJob' } }
    post:
      operationId: createGenerationJobs
      summary: Transactionally validate and queue generation jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobs]
              additionalProperties: false
              properties:
                jobs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/GenerationJobCreate' }
      responses:
        '201':
          description: Created jobs, or the existing jobs for an idempotent retry
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/GenerationJob' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{jobId}/accounting:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getGenerationJobAccounting
      summary: Read durable provider usage, cost, reservations, and audit history for a generation job
      responses:
        '200':
          description: Job and accounting snapshot
          content:
            application/json:
              schema:
                type: object
                required: [job, accounting]
                properties:
                  job: { $ref: '#/components/schemas/GenerationJob' }
                  accounting: { $ref: '#/components/schemas/GenerationAccounting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/accounting/ceiling:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: raiseGenerationJobCostCeiling
      summary: Explicitly raise a finite generation cost ceiling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostCeilingRaise'
      responses:
        '200':
          description: Updated job and accounting audit
          content:
            application/json:
              schema:
                type: object
                required: [job, accounting]
                properties:
                  job: { $ref: '#/components/schemas/GenerationJob' }
                  accounting: { $ref: '#/components/schemas/GenerationAccounting' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/accounting/recovery:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: approveGenerationJobCostRecovery
      summary: Acknowledge possible duplicate billing and approve one recovery retry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostRecoveryApproval' }
      responses:
        '200':
          description: Updated job and accounting audit
          content:
            application/json:
              schema:
                type: object
                required: [job, accounting]
                properties:
                  job: { $ref: '#/components/schemas/GenerationJob' }
                  accounting: { $ref: '#/components/schemas/GenerationAccounting' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/claim:
    post:
      operationId: claimGenerationJob
      summary: Atomically claim the next runnable job with an expiring worker lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string, minLength: 8, maxLength: 100 }
                leaseMs: { type: integer, minimum: 10000, maximum: 120000, default: 45000 }
      responses:
        '200': { description: Claimed job, or an empty result when no job is runnable }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    patch:
      operationId: checkpointGenerationJob
      summary: Validate and persist a source-grounded generation checkpoint while the worker lease is active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, leaseId, patch]
              properties:
                workerId: { type: string, minLength: 8, maxLength: 100 }
                leaseId: { type: string, minLength: 8, maxLength: 100 }
                patch: { $ref: '#/components/schemas/GenerationJobPatch' }
      responses:
        '200': { description: Durable generation checkpoint }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{jobId}/lease:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: renewGenerationJobLease
      summary: Renew a job lease only when the worker still owns its token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, leaseId]
              properties:
                workerId: { type: string, minLength: 8, maxLength: 100 }
                leaseId: { type: string, minLength: 8, maxLength: 100 }
                leaseMs: { type: integer, minimum: 10000, maximum: 120000, default: 45000 }
      responses:
        '200': { description: Renewed job and lease expiry }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{jobId}/complete:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: completeGenerationJob
      summary: Revalidate every question, atomically store the generated test, and complete its leased job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, leaseId, completionId, test]
              properties:
                workerId: { type: string, minLength: 8, maxLength: 100 }
                leaseId: { type: string, minLength: 8, maxLength: 100 }
                completionId: { type: string, minLength: 8, maxLength: 100 }
                test: { type: object }
                patch: { $ref: '#/components/schemas/GenerationJobPatch' }
      responses:
        '200': { description: Completed job and generated test }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{jobId}/resume:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: resumeJob
      summary: Queue the unfinished portion of a generation job
      description: Generation semantics and prior route history remain immutable. A resume may select an existing approved route, approve one existing route, or append one explicitly approved route.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  allOf: [{ $ref: '#/components/schemas/GenerationOptions' }]
                  description: Full generation snapshot. Only provider, model, and one append-only route approval may differ from the stored job.
                activeRouteIndex: { type: integer, minimum: 0 }
                providerAttempts:
                  type: array
                  description: Complete append-only attempt history, including the newly selected route and current accepted-question count.
                  items: { type: object }
                resetRounds: { type: boolean }
      responses:
        '200': { description: Updated generation job }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      summary: Cancel a generation job
      responses:
        '200': { description: Updated generation job }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      operationId: streamEvents
      summary: Stream storage and progress changes
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque local token
  parameters:
    DocumentId:
      in: path
      name: documentId
      required: true
      schema: { type: string, minLength: 1 }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, minLength: 1 }
    PluginId:
      in: path
      name: pluginId
      required: true
      schema: { type: string, minLength: 1 }
    ObjectSha256:
      in: path
      name: sha256
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
  responses:
    Okay:
      description: Operation completed
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, const: true }
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: A valid local bearer token is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    Health:
      type: object
      required: [ok, version, storage]
      properties:
        ok: { type: boolean, const: true }
        version: { type: integer, const: 1 }
        storage:
          type: object
          required: [databasePath, revision]
          properties:
            databasePath: { type: string }
            revision: { type: integer, minimum: 0 }
    HardwareCapabilities:
      type: object
      required: [platform, architecture, cpuCores, memoryGB, freeDiskGB, acceleration, recommendedProfile, reasons]
      properties:
        platform: { type: string }
        architecture: { type: string }
        cpuCores: { type: integer, minimum: 1 }
        memoryGB: { type: number, minimum: 0 }
        freeDiskGB: { type: number, minimum: 0 }
        acceleration: { type: array, items: { type: string } }
        recommendedProfile: { type: string, enum: [lite, balanced, max] }
        reasons: { type: array, items: { type: string } }
    ResolvedSettings:
      type: object
      required: [profile, values, sources]
      properties:
        profile: { type: string, enum: [lite, balanced, max] }
        values: { type: object, additionalProperties: true }
        sources: { type: object, additionalProperties: { type: string } }
    OnboardingState:
      type: object
      additionalProperties: false
      required: [onboardingVersion, completedSteps, currentStep, skipped]
      properties:
        onboardingVersion: { type: integer, const: 1 }
        completedSteps:
          type: array
          uniqueItems: true
          maxItems: 8
          items: { type: string, enum: [welcome, hardware, provider, document, instruction, generate, practice, complete] }
        currentStep: { type: string, enum: [welcome, hardware, provider, document, instruction, generate, practice, complete] }
        skipped: { type: boolean }
        completedAt: { type: integer, minimum: 1 }
        documentId: { type: string, minLength: 1, maxLength: 500 }
        generationJobId: { type: string, minLength: 1, maxLength: 500 }
        generationTestId: { type: string, minLength: 1, maxLength: 500 }
    ApplicationProfile:
      type: object
      required: [id, interfaceMode, hardwareProfile, onboarding, createdAt, updatedAt]
      properties:
        id: { type: string, const: default }
        interfaceMode: { type: string, enum: [simple, advanced] }
        hardwareProfile: { type: string, enum: [lite, balanced, max] }
        onboarding: { $ref: '#/components/schemas/OnboardingState' }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    LegacyMigration:
      type: object
      required: [id, status, expectedRecords, expectedHash, receivedRecords, backupPath, backupSha256, startedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [prepared, complete, failed] }
        expectedRecords: { type: integer, minimum: 0 }
        expectedHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        receivedRecords: { type: integer, minimum: 0 }
        receivedHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        backupPath: { type: string }
        backupSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        startedAt: { type: integer }
        completedAt: { type: integer }
        error: { type: string }
    BackupSummary:
      type: object
      required: [id, manifestValid]
      properties:
        id: { type: string }
        manifestValid: { type: boolean }
        createdAt: { type: integer }
        objectCount: { type: integer, minimum: 0 }
        objectBytes: { type: integer, minimum: 0 }
        error: { type: string }
    DocumentSummary:
      type: object
      required: [id, name, mimeType, size, tags, chunkCount]
      properties:
        id: { type: string }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer, minimum: 0 }
        tags: { type: array, items: { type: string } }
        chunkCount: { type: integer, minimum: 0 }
        pageCount: { type: integer, minimum: 1 }
        parserVersion: { type: string }
        extractionSchemaVersion: { type: integer, minimum: 1 }
        extractedAt: { type: integer, minimum: 0 }
    ExtractionRevision:
      type: object
      required: [parserVersion, extractionSchemaVersion, extractedAt, extractionContentHash]
      properties:
        parserVersion: { type: string }
        extractionSchemaVersion: { type: integer, minimum: 0 }
        extractedAt: { type: integer, minimum: 0 }
        extractionContentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    Document:
      type: object
      required: [id, name, createdAt, mimeType, size, tags, content, contentHash, parserVersion, extractionSchemaVersion, extractedAt, extractionContentHash]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: integer, minimum: 0 }
        mimeType: { type: string }
        size: { type: integer, minimum: 0 }
        tags: { type: array, items: { type: string } }
        content: { type: string }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        parserVersion: { type: string }
        extractionSchemaVersion: { type: integer, minimum: 1 }
        extractedAt: { type: integer, minimum: 0 }
        extractionContentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        extractionHistory:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ExtractionRevision' }
        originalFile: { $ref: '#/components/schemas/StoredObjectReference' }
        images:
          type: array
          items: { $ref: '#/components/schemas/DocumentImage' }
    DocumentImage:
      type: object
      required: [name, mimeType, object]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 1024 }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        object: { $ref: '#/components/schemas/StoredObjectReference' }
        page: { type: integer, minimum: 1 }
        sourceStart: { type: integer, minimum: 0 }
        caption: { type: string, maxLength: 10000 }
        context: { type: string, maxLength: 20000 }
        ocrText: { type: string, maxLength: 100000 }
    StoredObjectReference:
      type: object
      required: [__quizzerObject, algorithm, sha256, size]
      properties:
        __quizzerObject: { type: boolean, const: true }
        algorithm: { type: string, const: sha256 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, minimum: 0 }
        type: { type: string }
        name: { type: string }
        lastModified: { type: integer, minimum: 0 }
    ObjectStoreStatus:
      type: object
      required: [objectCount, objectBytes, referencedCount, referencedBytes, unreferencedCount, unreferencedBytes]
      properties:
        objectCount: { type: integer, minimum: 0 }
        objectBytes: { type: integer, minimum: 0 }
        referencedCount: { type: integer, minimum: 0 }
        referencedBytes: { type: integer, minimum: 0 }
        unreferencedCount: { type: integer, minimum: 0 }
        unreferencedBytes: { type: integer, minimum: 0 }
    IndexStatus:
      type: object
      required: [version, engine, databasePath, documentCount, chunkCount, documents, dense]
      properties:
        version: { type: integer, const: 1 }
        engine: { type: string, const: sqlite-fts5-bm25 }
        databasePath: { type: string }
        documentCount: { type: integer, minimum: 0 }
        chunkCount: { type: integer, minimum: 0 }
        documents: { type: array, items: { type: object } }
        dense:
          type: object
          required: [version, engine, enabled, embeddingModel, component, identity, status, tableCount, chunkCount, tables]
          properties:
            version: { type: integer, const: 1 }
            engine: { type: string }
            databasePath: { type: string }
            enabled: { type: boolean }
            embeddingModel: { type: string }
            component: { type: string }
            identity: { type: string }
            status: { type: string, enum: [disabled, not-built, ready, unavailable] }
            tableCount: { type: integer, minimum: 0 }
            chunkCount: { type: integer, minimum: 0 }
            activeTableCount: { type: integer, minimum: 0 }
            activeChunkCount: { type: integer, minimum: 0 }
            tables: { type: array, items: { type: object } }
            issue: { type: object }
    IndexJob:
      type: object
      required: [id, kind, status, documentIds, remainingDocumentIds, completedDocumentIds, results, force, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, const: index }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        documentIds: { type: array, items: { type: string } }
        remainingDocumentIds: { type: array, items: { type: string } }
        completedDocumentIds: { type: array, items: { type: string } }
        results: { type: array, items: { type: object } }
        force: { type: boolean }
        idempotencyKey: { type: string }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        startedAt: { type: integer }
        recoveredAt: { type: integer }
        finishedAt: { type: integer }
        error: { type: string }
    RetrievalResult:
      type: object
      required: [sourceSpanId, documentId, documentName, documentVersionHash, chunkIndex, parentId, content, excerpt, score, neighbors, parentContent]
      properties:
        sourceSpanId: { type: string }
        documentId: { type: string }
        documentName: { type: string }
        documentVersionHash: { type: string }
        chunkIndex: { type: integer, minimum: 0 }
        parentId: { type: string }
        page: { type: integer, minimum: 1 }
        breadcrumb: { type: string }
        content: { type: string }
        excerpt: { type: string }
        score: { type: number }
        bm25: { type: number }
        denseScore: { type: number }
        rerankScore: { type: number }
        retrievalChannels:
          type: array
          items: { type: string, enum: [sparse, dense] }
        neighbors: { type: array, items: { type: object } }
        parentContent: { type: string }
    RetrievalPreview:
      type: object
      required: [query, method, correctivePass, confidence, estimatedContextTokens, results]
      properties:
        query: { type: string }
        method: { type: string, enum: [sparse-bm25, hybrid-rrf] }
        requestedMethod: { type: string, const: hybrid-rrf }
        correctivePass: { type: boolean }
        confidence: { type: string, enum: [low, medium, high] }
        estimatedContextTokens: { type: integer, minimum: 0 }
        results: { type: array, items: { $ref: '#/components/schemas/RetrievalResult' } }
        refusal: { type: string }
        indexingError: { type: string }
        planningTrace:
          type: object
          additionalProperties: false
          required: [mode, condensedQuery, variants, fallback, hyde]
          properties:
            mode: { type: string, enum: [none, multi-query, hyde] }
            condensedQuery: { type: string, maxLength: 256 }
            variants:
              type: array
              minItems: 1
              maxItems: 5
              items: { type: string, maxLength: 256 }
            fallback: { type: boolean }
            hyde: { type: boolean }
            reason: { type: string, maxLength: 256 }
        reranking:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [disabled, ready, fallback] }
            component: { type: string }
            requestedComponent: { type: string }
            diversity: { type: string, const: maximal-marginal-relevance }
            issue: { type: string }
        dense:
          type: object
          required: [status, embeddingModel]
          properties:
            status: { type: string, enum: [ready, unavailable] }
            component: { type: string }
            embeddingModel: { type: string }
            candidates: { type: integer, minimum: 0 }
            error: { type: string }
    ProviderRoute:
      type: object
      required: [provider, privacy, paid, approved]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [plugin, ollama, llama-cpp, codex, claude-agent, antigravity-agent, gemini, anthropic, openai, openrouter, deepseek, openai-compatible] }
        model: { type: string, minLength: 1, maxLength: 200 }
        privacy: { type: string, enum: [local, signed-in-agent, remote-api] }
        paid: { type: boolean }
        approved: { type: boolean }
        pricing:
          type: object
          required: [inputMicroUsdPerMillionTokens, outputMicroUsdPerMillionTokens]
          additionalProperties: false
          properties:
            inputMicroUsdPerMillionTokens: { type: integer, minimum: 0, maximum: 9000000000000000 }
            outputMicroUsdPerMillionTokens: { type: integer, minimum: 0, maximum: 9000000000000000 }
        usage: { type: string, enum: [provider-reported, unavailable] }
    RAGProfile:
      type: object
      required: [id, retrieval, contextBudget, rerank]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        retrieval: { type: string, enum: [sparse, hybrid] }
        contextBudget: { type: integer, minimum: 256, maximum: 65536 }
        rerank: { type: boolean }
    GenerationOptions:
      type: object
      required: [provider, questionCount]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [plugin, ollama, llama-cpp, codex, claude-agent, antigravity-agent, gemini, anthropic, openai, openrouter, deepseek, openai-compatible] }
        model: { type: string, minLength: 1, maxLength: 200 }
        questionCount: { type: integer, minimum: 1, maximum: 200 }
        costCeilingMicroUsd: { type: integer, minimum: 0, maximum: 9000000000000000, description: Maximum estimated generation cost in micro-USD; omit for unlimited. }
        questionCounts:
          type: object
          required: [multipleChoice, fillBlank, reasoning, coding]
          additionalProperties: false
          properties:
            multipleChoice: { type: integer, minimum: 0, maximum: 200 }
            fillBlank: { type: integer, minimum: 0, maximum: 200 }
            reasoning: { type: integer, minimum: 0, maximum: 200 }
            coding: { type: integer, minimum: 0, maximum: 200 }
        multipleChoiceMode: { type: string, enum: [single, multiple, mixed] }
        coverageStrategy: { type: string, enum: [balanced, proportional, ai-selected, cross-document] }
        customInstruction: { type: string, minLength: 1, maxLength: 2000 }
        promptProfileSnapshot: { type: object }
        ragProfile: { $ref: '#/components/schemas/RAGProfile' }
        routeChain:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ProviderRoute' }
        resolvedSettings: { type: object }
    GenerationJobCreate:
      type: object
      required: [id, testId, name, status, documentIds, options, questions, rejected, rounds, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        testId: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, const: queued }
        documentIds: { type: array, minItems: 1, maxItems: 10000, uniqueItems: true, items: { type: string } }
        options:
          allOf:
            - { $ref: '#/components/schemas/GenerationOptions' }
          required: [provider, questionCount, ragProfile, routeChain, resolvedSettings]
        questions: { type: array, maxItems: 0 }
        rejected: { type: integer, const: 0 }
        rounds: { type: object, maxProperties: 0 }
        createdAt: { type: integer, minimum: 0 }
        updatedAt: { type: integer, minimum: 0 }
    GenerationJob:
      type: object
      required: [id, testId, name, status, documentIds, options, questions, createdAt, updatedAt]
      properties:
        id: { type: string }
        testId: { type: string }
        name: { type: string }
        status: { type: string, enum: [queued, running, waiting, paused, error, completed, cancelled] }
        documentIds: { type: array, items: { type: string } }
        options: { $ref: '#/components/schemas/GenerationOptions' }
        questions: { type: array, items: { type: object } }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        workerId: { type: string }
        leaseId: { type: string }
        leaseExpiresAt: { type: integer }
        completionId: { type: string }
        creationFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        usageSummary: { $ref: '#/components/schemas/UsageSummary' }
        usageAudit: { type: array, items: { type: object } }
        recoveryAttemptId: { type: string, pattern: '^attempt-[a-f0-9]{48}$' }
        rejections:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/GenerationRejection' }
    GenerationRejection:
      type: object
      required: [at, type, round, reason, count]
      additionalProperties: false
      properties:
        at: { type: integer, minimum: 0 }
        type: { type: string, enum: [multiple-choice, fill-blank, reasoning, coding] }
        round: { type: integer, minimum: 1, maximum: 5 }
        reason: { type: string, enum: [invalid-schema, ungrounded, instruction-mismatch, duplicate, empty-response, out-of-coverage] }
        count: { type: integer, minimum: 1, maximum: 200 }
        statement: { type: string, minLength: 1, maxLength: 500 }
    UsageSummary:
      type: object
      required: [inputTokens, outputTokens, totalTokens, reservedCostMicroUsd, finalizedCostMicroUsd]
      properties:
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        totalTokens: { type: integer, minimum: 0 }
        reservedCostMicroUsd: { type: integer, minimum: 0 }
        finalizedCostMicroUsd: { type: integer, minimum: 0 }
    GenerationAccounting:
      type: object
      required: [summary, audit]
      properties:
        summary: { $ref: '#/components/schemas/UsageSummary' }
        audit: { type: array, items: { type: object } }
    CostCeilingRaise:
      type: object
      required: [newCeilingMicroUsd, reason, confirmed]
      additionalProperties: false
      properties:
        newCeilingMicroUsd: { type: integer, minimum: 0, maximum: 9000000000000000 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        confirmed: { type: boolean, const: true }
    CostRecoveryApproval:
      type: object
      required: [reason, confirmed]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        confirmed: { type: boolean, const: true }
    GenerationJobPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        activeRouteIndex: { type: integer, minimum: 0 }
        coveragePlan: { type: object }
        error: { type: string }
        errorCode: { type: string }
        nextAttemptAt: { type: integer }
        options:
          allOf: [{ $ref: '#/components/schemas/GenerationOptions' }]
          description: Immutable generation snapshot with only the active provider and model changed to an existing pre-approved route.
        progress: { type: object }
        providerAttempts: { type: array, items: { type: object } }
        questions: { type: array, items: { type: object } }
        rejected: { type: integer, minimum: 0 }
        rejections: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/GenerationRejection' } }
        rounds: { type: object }
        status: { type: string, enum: [running, waiting, paused, error] }
    PluginSummary:
      type: object
      required: [id, name, capabilities]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        capabilities: { type: array, items: { type: string } }
        builtIn: { type: boolean }
        enabled: { type: boolean }
        compatible: { type: boolean }
        status: { type: string }
        trust: { type: string, enum: [signed, unsigned-local] }
        source: { type: string, enum: [local, registry] }
        registryId: { type: string }
        availableVersion: { type: string }
        updateAvailable: { type: boolean }
        rollbackAvailable: { type: boolean }
        warning: { type: string }
    PluginConfirmationRequired:
      type: object
      required: [error, code, confirmationRequired, reasons, details]
      additionalProperties: false
      properties:
        error: { type: string }
        code: { const: plugin_confirmation_required }
        confirmationRequired: { type: boolean, const: true }
        reasons:
          type: array
          items: { type: string }
        details:
          type: object
          additionalProperties: false
          required: [newNetwork, newSecrets, subprocess, newElevatedFs, largeDownload, downloadBytes, confirmationToken, pluginId, version]
          properties:
            newNetwork: { type: array, items: { type: string } }
            newSecrets: { type: array, items: { type: string } }
            subprocess: { type: boolean }
            newElevatedFs: { type: array, items: { type: string } }
            largeDownload: { type: boolean }
            downloadBytes: { type: integer, minimum: 0, maximum: 268435456 }
            confirmationToken: { type: string, pattern: '^[a-f0-9]{64}$' }
            pluginId: { type: string }
            version: { type: string }
    RegistryPluginSummary:
      type: object
      required: [id, name, version, capabilities, platforms, resources, permissions, manifestUrl, downloadSize, installed, compatible]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        capabilities: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: object } }
        resources: { type: object }
        permissions: { type: object }
        manifestUrl: { type: string }
        downloadBaseUrl: { type: string }
        downloadSize: { type: integer, minimum: 0, maximum: 268435456 }
        installed: { type: boolean }
        installedVersion: { type: string }
        updateAvailable: { type: boolean }
        compatible: { type: boolean }
