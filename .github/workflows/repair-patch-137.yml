name: Repair issue 137 patch
on:
  push:
    branches: ['fix/issue-137-proactive-updates']
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-137-proactive-updates
      - name: Install dependencies before patch validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-issue-137.yml')
          text = path.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", '', 1)
          anchor = "      - name: Make desktop update checks proactive and show release notes\n"
          setup = """      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci\n"""
          if anchor not in text:
              raise SystemExit('Patch step not found')
          path.write_text(text.replace(anchor, setup + anchor, 1))
          PY
          rm .github/workflows/repair-patch-137.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/patch-issue-137.yml .github/workflows/repair-patch-137.yml
          git commit -m 'chore: install dependencies for updater patch validation'
          git push origin HEAD:fix/issue-137-proactive-updates
