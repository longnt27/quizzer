name: Apply issue 167 patch
'on':
  push:
    branches:
      - fix/issue-167-prompt-type-instructions
    paths:
      - scripts/issue167_patch.py
      - .github/workflows/issue-167-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-167-prompt-type-instructions
      - run: python scripts/issue167_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(prompts): make question type instructions editable"
          git push origin HEAD:fix/issue-167-prompt-type-instructions
