name: Prepare beta.10

on:
  push:
    branches:
      - release/v1.0.0-beta.10

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-beta.10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.0.0-beta.10 --no-git-tag-version
          sed -i 's/v1\.0\.0-beta\.5/v1.0.0-beta.10/g' README.md
          git rm .github/workflows/prepare-beta10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md
          git commit -m 'chore(release): prepare v1.0.0-beta.10'
          git push origin HEAD:release/v1.0.0-beta.10
