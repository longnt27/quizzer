name: Patch issue 139
on:
  push:
    branches: ['fix/issue-139-prompt-width']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-139-prompt-width
      - name: Keep Settings width stable across tabs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/SettingsModal.tsx')
          text = path.read_text()
          old = "width={activeTab === 'prompts' ? 'min(1120px, calc(100vw - 32px))' : 'min(960px, calc(100vw - 32px))'}"
          new = "width={'min(960px, calc(100vw - 32px))'}"
          if old not in text:
              raise SystemExit('Settings modal width expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cat > e2e/settings-prompt-width.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';
          import { dismissOnboarding, setInterfaceMode } from './helpers';

          test('Prompt Studio keeps the Settings modal width stable', async ({ page }) => {
            await dismissOnboarding(page);
            await setInterfaceMode(page, 'advanced');
            await page.locator('.sidebar-footer:visible').getByRole('button', { name: 'Settings' }).click();
            const dialog = page.getByRole('dialog', { name: 'Settings' });
            const before = await dialog.boundingBox();
            expect(before).not.toBeNull();

            await dialog.getByRole('tab', { name: 'Prompt Studio' }).click();
            await expect(dialog.getByRole('tabpanel', { name: 'Prompt Studio' })).toBeVisible();
            const after = await dialog.boundingBox();
            expect(after).not.toBeNull();
            expect(Math.abs((after?.width ?? 0) - (before?.width ?? 0))).toBeLessThan(1);
          });
          EOF
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/patch-issue-139.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/SettingsModal.tsx e2e/settings-prompt-width.spec.ts .github/workflows/patch-issue-139.yml
          git commit -m 'fix(settings): keep modal width stable across tabs'
          git push origin HEAD:fix/issue-139-prompt-width
