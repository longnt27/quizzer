name: Patch issue 138
on:
  push:
    branches: ['fix/issue-138-document-back-position']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-138-document-back-position
      - name: Move document back action outside content padding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/DocumentView.tsx')
          text = path.read_text()
          old = '''    <div className="document-view">\n      <Button type="text" icon={<ArrowLeftOutlined />} onClick={onBack}>Back to home</Button>\n      <div className="document-heading">'''
          new = '''    <div className="document-view">\n      <Button className="document-back-button" type="text" icon={<ArrowLeftOutlined />} onClick={onBack}>Back to home</Button>\n      <div className="document-view-content">\n      <div className="document-heading">'''
          if old not in text:
              raise SystemExit('Document view opening not found')
          text = text.replace(old, new, 1)
          old_end = '''      ]} />\n      {askOpen && <DocumentAskModal document={document} onClose={() => setAskOpen(false)} />}'''
          new_end = '''      ]} />\n      </div>\n      {askOpen && <DocumentAskModal document={document} onClose={() => setAskOpen(false)} />}'''
          if old_end not in text:
              raise SystemExit('Document view closing anchor not found')
          path.write_text(text.replace(old_end, new_end, 1))

          css = Path('src/index.css')
          text = css.read_text()
          old_css = '.document-view { padding: 32px; max-width: 1100px; margin: 0 auto; }'
          new_css = '''.document-view { position: relative; width: 100%; min-height: 100%; }\n.document-back-button { position: absolute; top: 16px; left: 16px; z-index: 1; }\n.document-view-content { width: min(1100px, 100%); margin: 0 auto; padding: 64px 32px 32px; }'''
          if old_css not in text:
              raise SystemExit('Document view CSS not found')
          text = text.replace(old_css, new_css, 1)
          old_mobile = '  .document-view { padding: 16px; }'
          new_mobile = '  .document-view-content { padding: 56px 16px 16px; }'
          if old_mobile not in text:
              raise SystemExit('Document view mobile CSS not found')
          css.write_text(text.replace(old_mobile, new_mobile, 1))

          spec = Path('e2e/documents.spec.ts')
          text = spec.read_text()
          anchor = "  await expect(documentView.getByRole('heading', { name: 'study-guide' })).toBeVisible();\n"
          addition = """  const backButton = documentView.getByRole('button', { name: 'Back to home' });\n  await expect(backButton).toHaveCSS('position', 'absolute');\n  await expect(backButton).toHaveCSS('left', '16px');\n  await expect(backButton).toHaveCSS('top', '16px');\n"""
          if anchor not in text:
              raise SystemExit('Document e2e anchor not found')
          spec.write_text(text.replace(anchor, anchor + addition, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/patch-issue-138.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/DocumentView.tsx src/index.css e2e/documents.spec.ts .github/workflows/patch-issue-138.yml
          git commit -m 'fix(documents): align back action with test view'
          git push origin HEAD:fix/issue-138-document-back-position
