name: Patch issue 140
on:
  push:
    branches: ['fix/issue-140-rounded-settings-pane']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-140-rounded-settings-pane
      - name: Round Settings content pane
        shell: bash
        run: |
          cat >> src/components/SettingsModal.css <<'EOF'

          .settings-modal .settings-content-pane {
            border-radius: 12px;
          }
          EOF
          cat > e2e/settings-rounded-pane.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';
          import { dismissOnboarding } from './helpers';

          test('Settings content pane has rounded corners', async ({ page }) => {
            await dismissOnboarding(page);
            await page.locator('.sidebar-footer:visible').getByRole('button', { name: 'Settings' }).click();
            const dialog = page.getByRole('dialog', { name: 'Settings' });
            const pane = dialog.locator('.settings-content-pane');
            await expect(pane).toBeVisible();
            await expect(pane).toHaveCSS('border-radius', '12px');
          });
          EOF
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/patch-issue-140.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/SettingsModal.css e2e/settings-rounded-pane.spec.ts .github/workflows/patch-issue-140.yml
          git commit -m 'style(settings): round inner content pane'
          git push origin HEAD:fix/issue-140-rounded-settings-pane
