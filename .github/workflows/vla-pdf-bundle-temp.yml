name: Temporary VLA PDF Bundle

on:
  pull_request:
    branches: [develop]
    paths:
      - "vla-download-trigger.txt"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and package papers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, time, re

          classic = [
            ("01 RT-1.pdf", "RT-1: Robotics Transformer for Real-World Control at Scale", ["https://www.roboticsproceedings.org/rss19/p025.pdf"]),
            ("02 PaLM-E.pdf", "PaLM-E: An Embodied Multimodal Language Model", ["https://proceedings.mlr.press/v202/driess23a/driess23a.pdf"]),
            ("03 VIMA.pdf", "VIMA: Robot Manipulation with Multimodal Prompts", ["https://proceedings.mlr.press/v202/jiang23b/jiang23b.pdf"]),
            ("04 Diffusion Policy.pdf", "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion", ["https://www.roboticsproceedings.org/rss19/p026.pdf"]),
            ("05 ALOHA - ACT.pdf", "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware", ["https://www.roboticsproceedings.org/rss19/p016.pdf"]),
            ("06 RT-2.pdf", "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", ["https://proceedings.mlr.press/v229/zitkovich23a/zitkovich23a.pdf"]),
            ("07 BridgeData V2.pdf", "BridgeData V2: A Dataset for Robot Learning at Scale", ["https://proceedings.mlr.press/v229/walke23a/walke23a.pdf"]),
            ("08 MimicPlay.pdf", "MimicPlay: Long-Horizon Imitation Learning by Watching Human Play", ["https://proceedings.mlr.press/v229/wang23a/wang23a.pdf"]),
            ("09 LIBERO.pdf", "LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning", ["https://proceedings.neurips.cc/paper_files/paper/2023/file/8c3c666820ea055a77726d66fc7d447f-Paper-Datasets_and_Benchmarks-Conference.pdf"]),
            ("10 Open X-Embodiment.pdf", "Open X-Embodiment: Robotic Learning Datasets and RT-X Models", ["https://arxiv.org/pdf/2310.08864.pdf"]),
            ("11 Octo.pdf", "Octo: An Open-Source Generalist Robot Policy", ["https://www.roboticsproceedings.org/rss20/p090.pdf"]),
            ("12 DROID.pdf", "DROID: A Large-Scale In-The-Wild Robot Manipulation Dataset", ["https://www.roboticsproceedings.org/rss20/p120.pdf"]),
            ("13 RoboCasa.pdf", "RoboCasa: Large-Scale Simulation of Everyday Tasks for Generalist Robots", ["https://www.roboticsproceedings.org/rss20/p050.pdf"]),
            ("14 OpenVLA.pdf", "OpenVLA: An Open-Source Vision-Language-Action Model", ["https://proceedings.mlr.press/v270/kim25c/kim25c.pdf"]),
            ("15 RDT-1B.pdf", "RDT-1B: a Diffusion Foundation Model for Bimanual Manipulation", ["https://proceedings.iclr.cc/paper_files/paper/2025/hash/49f80e4d2471ad4f2edf4f5f1ab62339-Paper-Conference.pdf"]),
            ("16 FAST.pdf", "FAST: Efficient Action Tokenization for Vision-Language-Action Models", ["https://www.roboticsproceedings.org/rss21/p012.pdf"]),
            ("17 pi0.5.pdf", "pi0.5: a Vision-Language-Action Model with Open-World Generalization", ["https://proceedings.mlr.press/v305/black25a/black25a.pdf"]),
          ]

          head = [
            ("01 Being-H0.pdf", "Vision-Language-Action Pretraining from Large-Scale Human Videos", ["https://proceedings.mlr.press/v306/luo26e/luo26e.pdf"]),
            ("02 JALA.pdf", "Joint-Aligned Latent Action: Towards Scalable VLA Pretraining in the Wild", ["https://openaccess.thecvf.com/content/CVPR2026/papers/Luo_Joint-Aligned_Latent_Action_Towards_Scalable_VLA_Pretraining_in_the_Wild_CVPR_2026_paper.pdf"]),
            ("03 Data Co-training Study.pdf", "A Systematic Study of Data Modalities and Strategies for Co-training Large Behavior Models for Robot Manipulation", ["https://www.roboticsproceedings.org/rss22/p007.pdf"]),
            ("04 UniDex.pdf", "UniDex: A Robot Foundation Suite for Universal Dexterous Hand Control from Egocentric Human Videos", ["https://openaccess.thecvf.com/content/CVPR2026/papers/Zhang_UniDex_A_Robot_Foundation_Suite_for_Universal_Dexterous_Hand_Control_CVPR_2026_paper.pdf"]),
            ("05 Task-Agnostic VLA Pretraining.pdf", "Learning to Move Before Learning to Do: Task-Agnostic Pretraining for VLAs", ["https://proceedings.mlr.press/v306/shi26aa/shi26aa.pdf"]),
            ("06 LARA.pdf", "LARA: Latent Action Representation Alignment for Vision-Language-Action Models", ["https://proceedings.mlr.press/v306/liu26bl/liu26bl.pdf"]),
            ("07 Unified Latent Action - Cycle Consistency.pdf", "Learning a Unified Latent Action Space from Videos with Action-centric Cycle Consistency", ["https://openaccess.thecvf.com/content/CVPR2026/papers/Chen_Learning_a_Unified_Latent_Action_Space_from_Videos_with_Action-centric_CVPR_2026_paper.pdf"]),
            ("08 Spatial-Aware VLA Pretraining.pdf", "Spatial-Aware VLA Pretraining through Visual-Physical Alignment from Human Videos", ["https://openaccess.thecvf.com/content/CVPR2026/papers/Feng_Spatial-Aware_VLA_Pretraining_through_Visual-Physical_Alignment_from_Human_Videos_CVPR_2026_paper.pdf"]),
            ("09 Pose-VLA.pdf", "Universal Pose Pretraining for Generalizable Vision-Language-Action Policies", ["https://www.roboticsproceedings.org/rss22/p145.pdf"]),
            ("10 LAP.pdf", "LAP: Language-Action Pre-training Enables Zero-Shot Cross-Embodiment Transfer", ["https://www.roboticsproceedings.org/rss22/p203.pdf"]),
            ("11 LDA-1B.pdf", "LDA-1B: Scaling Latent Dynamics Action Model via Universal Embodied Data Ingestion", ["https://www.roboticsproceedings.org/rss22/p210.pdf"]),
            ("12 DreamDojo.pdf", "DreamDojo: A Generalist Robot World Model from Large-Scale Human Videos", ["https://proceedings.mlr.press/v306/gao26q/gao26q.pdf"]),
            ("13 Cross-Embodiment World Models.pdf", "Cross-Embodiment Robot Foundation World Models with Latent Actions", ["https://proceedings.mlr.press/v306/huang26bv/huang26bv.pdf"]),
            ("14 mimic-video.pdf", "mimic-video: Video-Action Models for Generalizable Robot Control Beyond VLAs", ["https://www.roboticsproceedings.org/rss22/p077.pdf"]),
            ("15 Causal World Modeling.pdf", "Causal World Modeling for Robot Control", ["https://www.roboticsproceedings.org/rss22/p016.pdf"]),
            ("16 X-DiffVLA.pdf", "X-DiffVLA: X-Embodied Diffusion Action Heads for Vision-Language-Action Models", ["https://www.roboticsproceedings.org/rss22/p081.pdf"]),
            ("17 Actions as Language.pdf", "Actions as Language: Fine-Tuning VLMs into VLAs Without Catastrophic Forgetting", ["https://proceedings.iclr.cc/paper_files/paper/2026/hash/7a0f8055c838df8e62329a76c7c6403d-Paper-Conference.pdf"]),
            ("18 Discrete Diffusion VLA.pdf", "Discrete Diffusion VLA: Bringing Discrete Diffusion to Action Decoding in Vision-Language-Action Policies", ["https://proceedings.mlr.press/v306/liang26l/liang26l.pdf"]),
            ("19 SRPO.pdf", "SRPO: Self-Referential Policy Optimization for Vision-Language-Action Models", ["https://openaccess.thecvf.com/content/CVPR2026/papers/Fei_SRPO_Self-Referential_Policy_Optimization_for_Vision-Language-Action_Models_CVPR_2026_paper.pdf"]),
            ("20 RoboTwin 2.0.pdf", "RoboTwin 2.0: A Scalable Data Generator and Benchmark with Strong Domain Randomization for Robust Bimanual Robotic Manipulation", ["https://proceedings.mlr.press/v306/chen26j/chen26j.pdf"]),
          ]

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 VLA-reading-pack/1.0"})

          def fetch(url, dest):
              last = None
              for attempt in range(4):
                  try:
                      with session.get(url, timeout=120, allow_redirects=True, stream=True) as r:
                          r.raise_for_status()
                          first = b""
                          with open(dest, "wb") as f:
                              for chunk in r.iter_content(1024 * 1024):
                                  if not chunk:
                                      continue
                                  if not first:
                                      first = chunk[:8]
                                  f.write(chunk)
                      if not first.startswith(b"%PDF"):
                          raise RuntimeError(f"not a PDF: {url}")
                      if Path(dest).stat().st_size < 10000:
                          raise RuntimeError(f"PDF too small: {url}")
                      return url
                  except Exception as e:
                      last = e
                      try:
                          Path(dest).unlink()
                      except FileNotFoundError:
                          pass
                      time.sleep(2 ** attempt)
              raise last

          def build(folder, items):
              out = Path(folder)
              out.mkdir(parents=True, exist_ok=True)
              index = ["Filename\tTitle\tSource"]
              missing = []
              for i, (name, title, urls) in enumerate(items, 1):
                  dest = out / name
                  ok = None
                  err = None
                  for url in urls:
                      try:
                          ok = fetch(url, dest)
                          break
                      except Exception as e:
                          err = repr(e)
                  if ok:
                      print(f"[OK] {name} <- {ok}")
                      index.append(f"{name}\t{title}\t{ok}")
                  else:
                      print(f"[FAIL] {name}: {err}")
                      missing.append(f"{name}\t{title}\t{err}")
              (out / "INDEX.txt").write_text("\n".join(index) + "\n", encoding="utf-8")
              if missing:
                  (out / "MISSING.txt").write_text("\n".join(missing) + "\n", encoding="utf-8")
              return missing

          m1 = build("VLA_Kinh_dien", classic)
          m2 = build("VLA_HEAD_2026", head)
          if m1 or m2:
              print("Some downloads failed; artifacts still uploaded with MISSING.txt for inspection.")
          PY

      - name: Upload classic papers
        uses: actions/upload-artifact@v4
        with:
          name: VLA_Kinh_dien
          path: VLA_Kinh_dien/
          compression-level: 0
          retention-days: 1

      - name: Upload 2026 papers
        uses: actions/upload-artifact@v4
        with:
          name: VLA_HEAD_2026
          path: VLA_HEAD_2026/
          compression-level: 0
          retention-days: 1
