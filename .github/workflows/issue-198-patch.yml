name: Apply issue 198 patch

on:
  push:
    branches: [fix/issue-198-auto-index]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-issue-198.mjs
      - run: rm scripts/patch-issue-198.mjs .github/workflows/issue-198-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: automatically index synced documents"
          git push
