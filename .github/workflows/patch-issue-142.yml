name: Patch issue 142
on:
  push:
    branches: ['fix/issue-142-history-line']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-142-history-line
      - name: Use only the timeline connector for history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/TestSummary.tsx')
          text = path.read_text()
          old = "                        paddingRight: 8,\n                        borderLeft: '1px solid var(--border)',\n"
          new = "                        paddingRight: 8,\n"
          if old not in text:
              raise SystemExit('History panel border not found')
          text = text.replace(old, new, 1)
          old_timeline = '<Timeline style={{ marginTop: 12 }} items={test.attempts'
          new_timeline = '<Timeline className="summary-timeline" style={{ marginTop: 12 }} items={test.attempts'
          if old_timeline not in text:
              raise SystemExit('History timeline not found')
          path.write_text(text.replace(old_timeline, new_timeline, 1))
          PY
          cat > test/test-summary-layout.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          test('history uses the Ant Design timeline connector instead of a panel-height border', async () => {
            const source = await readFile(new URL('../src/components/TestSummary.tsx', import.meta.url), 'utf8');
            const historyStart = source.indexOf('className="summary-history"');
            const historyEnd = source.indexOf('{/* JSON Fixer Modal */}', historyStart);
            assert.notEqual(historyStart, -1);
            assert.notEqual(historyEnd, -1);
            const history = source.slice(historyStart, historyEnd);
            assert.doesNotMatch(history, /borderLeft/);
            assert.match(history, /<Timeline className="summary-timeline"/);
          });
          EOF
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/patch-issue-142.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/TestSummary.tsx test/test-summary-layout.test.mjs .github/workflows/patch-issue-142.yml
          git commit -m 'fix(summary): align history connector with timeline dots'
          git push origin HEAD:fix/issue-142-history-line
