name: Prepare beta.9 metadata

on:
  push:
    branches: [release/v1.0.0-beta.9]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-beta.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare release metadata
        run: |
          npm version 1.0.0-beta.9 --no-git-tag-version
          sed -i 's/v1\.0\.0-beta\.5/v1.0.0-beta.9/g' README.md
          rm .github/workflows/prepare-beta9.yml
      - name: Commit release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json README.md .github/workflows/prepare-beta9.yml
          git commit -m 'chore(release): prepare v1.0.0-beta.9'
          git push origin HEAD:release/v1.0.0-beta.9
