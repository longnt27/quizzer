name: Apply issue 161 patch
'on':
  push:
    branches:
      - fix/issue-161-dense-reindex-feedback
    paths:
      - scripts/issue161_patch.py
      - .github/workflows/issue-161-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-161-dense-reindex-feedback
      - run: python scripts/issue161_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(indexing): scope reindex feedback to document"
          git push origin HEAD:fix/issue-161-dense-reindex-feedback
