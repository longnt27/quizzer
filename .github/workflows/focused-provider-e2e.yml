name: Focused provider E2E

on: push

jobs:
  focused-e2e:
    if: github.ref_name == 'fix/issue-197-embedding-options'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run focused embedding E2E
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            e2e/embedding-providers.spec.ts \
            e2e/embedding-install.spec.ts \
            e2e/plugins-modal.spec.ts \
            --project=chromium --reporter=line 2>&1 | tee focused-e2e.log
      - name: Upload focused E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-provider-e2e-diagnostics
          path: |
            focused-e2e.log
            test-results
          if-no-files-found: ignore
