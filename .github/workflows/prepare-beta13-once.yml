name: Prepare beta.13 once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/prepare-beta13-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump synchronized release metadata
        run: npm version 1.0.0-beta.13 --no-git-tag-version
      - name: Commit release metadata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-beta13-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/prepare-beta13-once.yml
          git commit -m "chore(release): prepare v1.0.0-beta.13"
          git push origin HEAD:develop
