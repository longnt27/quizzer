name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run license:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run eval:rag
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run test:e2e:cost

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  electron-shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            xvfb: '1'
          - runner: windows-2025
            platform: windows
            xvfb: '0'
          - runner: macos-15
            platform: macos
            xvfb: '0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux headless display
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Install Playwright browser (Linux)
        if: matrix.platform == 'linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright browser (macOS and Windows)
        if: matrix.platform != 'linux'
        run: npx playwright install chromium
      - run: npm run test:e2e:electron
        env:
          ELECTRON_SHELL_USE_XVFB: ${{ matrix.xvfb }}
