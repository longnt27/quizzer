name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v1.0.0-beta.1
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]
      publish:
        description: Publish the GitHub Release after validation
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_CHANNEL: ${{ inputs.channel || (contains(github.ref_name, '-') && 'beta' || 'stable') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be a canonical v-prefixed semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          test "v${PACKAGE_VERSION}" = "$RELEASE_TAG"
          EXPECTED_CHANNEL=stable
          if [[ "$PACKAGE_VERSION" == *-* ]]; then EXPECTED_CHANNEL=beta; fi
          if [ "$RELEASE_CHANNEL" != "$EXPECTED_CHANNEL" ]; then
            echo "Release channel $RELEASE_CHANNEL does not match $PACKAGE_VERSION ($EXPECTED_CHANNEL)" >&2
            exit 1
          fi
      - name: Verify curated release notes
        shell: bash
        run: |
          RELEASE_NOTES_PATH="release-notes/${RELEASE_TAG}.md"
          if [ ! -s "$RELEASE_NOTES_PATH" ]; then
            echo "Curated, user-facing release notes are required at $RELEASE_NOTES_PATH" >&2
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run license:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run eval:rag
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run test:e2e:cost
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: sbom.cdx.json
          if-no-files-found: error

  landing:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Generate landing CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > landing-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: landing-metadata
          path: landing/landing-sbom.cdx.json
          if-no-files-found: error

  runtime:
    needs: verify
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            architecture: arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x64
          # Keep x64 native-addon compilation on supported Visual Studio 2022.
          - runner: windows-2022
            platform: windows
            architecture: x64
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm squashfs-tools
      - name: Cache verified AppImage runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: node scripts/prepare-appimage-runtime.mjs --arch "${{ matrix.architecture }}"
      - name: Import Apple signing identity
        if: matrix.platform == 'macos' && vars.QUIZZER_MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY_SECRET: ${{ secrets.APPLE_IDENTITY }}
          APPLE_INSTALLER_IDENTITY_SECRET: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"
          : "${MACOS_INSTALLER_CERTIFICATE:?MACOS_INSTALLER_CERTIFICATE is required}"
          : "${MACOS_INSTALLER_CERTIFICATE_PASSWORD:?MACOS_INSTALLER_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_IDENTITY_SECRET:?APPLE_IDENTITY is required}"
          : "${APPLE_INSTALLER_IDENTITY_SECRET:?APPLE_INSTALLER_IDENTITY is required}"
          : "${APPLE_ID:?APPLE_ID is required}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          node -e "require('node:fs').writeFileSync('certificate.p12', Buffer.from(process.env.MACOS_CERTIFICATE, 'base64'))"
          node -e "require('node:fs').writeFileSync('installer-certificate.p12', Buffer.from(process.env.MACOS_INSTALLER_CERTIFICATE, 'base64'))"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import installer-certificate.p12 -k build.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12 installer-certificate.p12
          echo "APPLE_IDENTITY=$APPLE_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_INSTALLER_IDENTITY=$APPLE_INSTALLER_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Import Windows signing identity
        if: matrix.platform == 'windows' && vars.QUIZZER_WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          EXPECTED_WINDOWS_CERTIFICATE_SHA256: ${{ vars.QUIZZER_WINDOWS_CERTIFICATE_SHA256 }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw 'WINDOWS_CERTIFICATE is required' }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'WINDOWS_CERTIFICATE_PASSWORD is required' }
          if ($env:EXPECTED_WINDOWS_CERTIFICATE_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { throw 'QUIZZER_WINDOWS_CERTIFICATE_SHA256 is required' }
          [IO.File]::WriteAllBytes('certificate.pfx', [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $Certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            (Resolve-Path 'certificate.pfx').Path,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          $Hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $ActualCertificateSha256 = [BitConverter]::ToString($Hasher.ComputeHash($Certificate.RawData)).Replace('-', '')
          } finally {
            $Hasher.Dispose()
            $Certificate.Dispose()
          }
          if ($ActualCertificateSha256 -ne $env:EXPECTED_WINDOWS_CERTIFICATE_SHA256.ToUpperInvariant()) {
            throw 'QUIZZER_WINDOWS_CERTIFICATE_SHA256 does not match WINDOWS_CERTIFICATE'
          }
          "WINDOWS_CERTIFICATE_FILE=$((Resolve-Path 'certificate.pfx').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build standalone CLI
        run: npm run build:cli
      - name: Notarize standalone CLI
        if: matrix.platform == 'macos' && vars.QUIZZER_MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          ditto -c -k --keepParent out/cli/quizzer out/cli/quizzer-notarization.zip
          xcrun notarytool submit out/cli/quizzer-notarization.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm out/cli/quizzer-notarization.zip
      - name: Normalize release artifacts
        run: node scripts/collect-release-artifacts.mjs --cli-only --platform ${{ matrix.platform }} --architecture ${{ matrix.architecture }}
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: release-artifacts/quizzer-*
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    needs: [verify, landing, runtime]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Merge matrix artifacts
        run: node scripts/merge-release-artifacts.mjs --input downloaded-artifacts --output release-bundle
      - name: Add SBOMs
        shell: bash
        run: |
          cp downloaded-artifacts/release-metadata/sbom.cdx.json release-bundle/sbom.cdx.json
          cp downloaded-artifacts/landing-metadata/landing-sbom.cdx.json release-bundle/landing-sbom.cdx.json
      - name: Sign release manifest
        env:
          QUIZZER_RELEASE_PRIVATE_KEY: ${{ secrets.QUIZZER_RELEASE_PRIVATE_KEY }}
          QUIZZER_RELEASE_PUBLIC_KEY: ${{ vars.QUIZZER_RELEASE_PUBLIC_KEY }}
          QUIZZER_RELEASE_PUBLIC_KEY_ID: ${{ vars.QUIZZER_RELEASE_PUBLIC_KEY_ID }}
        run: |
          npm run release:trust
          npm run release:manifest -- --version "$RELEASE_TAG" --channel "$RELEASE_CHANNEL" --tag "$RELEASE_TAG" --artifacts release-bundle/artifacts.json --output release-bundle/release-manifest.json
      - name: Prepare verifying installers
        env:
          QUIZZER_RELEASE_PRIVATE_KEY: ${{ secrets.QUIZZER_RELEASE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          QUIZZER_WINDOWS_CERTIFICATE_SHA256: ${{ vars.QUIZZER_WINDOWS_CERTIFICATE_SHA256 }}
        run: npm run release:installers -- --manifest release-bundle/release-manifest.json --output release-bundle
      - name: Attest release artifacts and manifest
        uses: actions/attest@v4
        with:
          subject-path: |
            release-bundle/quizzer-*
            release-bundle/install.sh
            release-bundle/install.ps1
            release-bundle/release-manifest.json
            release-bundle/release-manifest.canonical.json
            release-bundle/release-manifest.sig
            release-bundle/sbom.cdx.json
            release-bundle/landing-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ env.RELEASE_TAG }}
          path: |
            release-bundle/quizzer-*
            release-bundle/install.sh
            release-bundle/install.ps1
            release-bundle/release-manifest.json
            release-bundle/release-manifest.canonical.json
            release-bundle/release-manifest.sig
            release-bundle/sbom.cdx.json
            release-bundle/landing-sbom.cdx.json
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES_PATH="release-notes/${RELEASE_TAG}.md"
          PRERELEASE=()
          if [ "$RELEASE_CHANNEL" = beta ]; then PRERELEASE=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-bundle/quizzer-* release-bundle/install.sh release-bundle/install.ps1 release-bundle/release-manifest.json release-bundle/release-manifest.canonical.json release-bundle/release-manifest.sig release-bundle/sbom.cdx.json release-bundle/landing-sbom.cdx.json --verify-tag --notes-file "$RELEASE_NOTES_PATH" --title "Quizzer ${RELEASE_TAG#v}" "${PRERELEASE[@]}"
