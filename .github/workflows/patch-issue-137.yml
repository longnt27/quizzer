name: Patch issue 137
on:
  push:
    branches: ['fix/issue-137-proactive-updates']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-137-proactive-updates
      - name: Make desktop update checks proactive and show release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path('src/types/updater.ts')
          text = types.read_text()
          old = "  publishedAt: string;\n  publicKeyId: string;\n"
          new = "  publishedAt: string;\n  releaseNotes?: string;\n  publicKeyId: string;\n"
          if old not in text:
              raise SystemExit('UpdateInfo insertion point not found')
          types.write_text(text.replace(old, new, 1))

          updater = Path('desktop/updater.mjs')
          text = updater.read_text()
          anchor = "export const MAX_METADATA_BYTES = 1024 * 1024; // 1 MiB\n"
          addition = """export const MAX_RELEASE_NOTES_CHARS = 20_000;\n\nexport const normalizeReleaseNotes = value => {\n  if (typeof value !== 'string') return '';\n  return value.replace(/\\r\\n?/g, '\\n').trim().slice(0, MAX_RELEASE_NOTES_CHARS);\n};\n"""
          if anchor not in text:
              raise SystemExit('Updater constants anchor not found')
          text = text.replace(anchor, anchor + addition, 1)

          method_anchor = "  resolvePublicKey(publicKeyId) {\n"
          method = """  async fetchReleaseNotesForTag(tag) {\n    const normalizedTag = typeof tag === 'string' && tag.startsWith('v') ? tag : `v${tag}`;\n    if (!isValidReleaseTag(normalizedTag)) return undefined;\n    const releaseUrl = `https://api.github.com/repos/${CANONICAL_REPOSITORY}/releases/tags/${encodeURIComponent(normalizedTag)}`;\n    if (!validateCanonicalReleaseUrl(releaseUrl, CANONICAL_REPOSITORY)) return undefined;\n    try {\n      const releaseText = await fetchBoundedText(\n        this.fetch,\n        releaseUrl,\n        { headers: { 'User-Agent': `Quizzer-Desktop-Updater/${this.currentVersion}`, Accept: 'application/vnd.github+json' } },\n        MAX_METADATA_BYTES,\n      );\n      const release = JSON.parse(releaseText);\n      if (!release || typeof release !== 'object' || Array.isArray(release) || release.draft === true) return undefined;\n      if (release.tag_name && release.tag_name !== normalizedTag) return undefined;\n      return normalizeReleaseNotes(release.body) || undefined;\n    } catch {\n      // Release notes are display-only metadata. Update trust continues to come\n      // exclusively from the signed release manifest.\n      return undefined;\n    }\n  }\n\n"""
          if method_anchor not in text:
              raise SystemExit('Updater method anchor not found')
          text = text.replace(method_anchor, method + method_anchor, 1)

          old = """      let manifestUrl;\n      if (options.tag) {"""
          new = """      let manifestUrl;\n      let releaseTag;\n      let releaseNotes;\n      if (options.tag) {"""
          if old not in text:
              raise SystemExit('Manifest URL declaration not found')
          text = text.replace(old, new, 1)

          old = """        manifestUrl = `https://github.com/${repository}/releases/download/${encodeURIComponent(options.tag)}/release-manifest.json`;\n      } else if (channel === 'stable') {"""
          new = """        releaseTag = options.tag;\n        manifestUrl = `https://github.com/${repository}/releases/download/${encodeURIComponent(options.tag)}/release-manifest.json`;\n      } else if (channel === 'stable') {"""
          if old not in text:
              raise SystemExit('Tagged manifest branch not found')
          text = text.replace(old, new, 1)

          old = """        const selectedTag = prereleases[0].tag_name;\n        manifestUrl = `https://github.com/${repository}/releases/download/${encodeURIComponent(selectedTag)}/release-manifest.json`;"""
          new = """        const selectedRelease = prereleases[0];\n        const selectedTag = selectedRelease.tag_name;\n        releaseTag = selectedTag;\n        releaseNotes = normalizeReleaseNotes(selectedRelease.body) || undefined;\n        manifestUrl = `https://github.com/${repository}/releases/download/${encodeURIComponent(selectedTag)}/release-manifest.json`;"""
          if old not in text:
              raise SystemExit('Beta selected release block not found')
          text = text.replace(old, new, 1)

          old = """      const comparison = compareSemver(verifiedManifest.version, this.currentVersion);\n      if (comparison <= 0 && !options.force) {"""
          new = """      const comparison = compareSemver(verifiedManifest.version, this.currentVersion);\n      if (comparison <= 0 && !options.force) {"""
          if old not in text:
              raise SystemExit('Comparison block not found')
          # No change here; keep notes lookup after the up-to-date fast path.

          old = """      this.state = 'available';\n      this.updateInfo = {\n        version: verifiedManifest.version,\n        channel: verifiedManifest.channel,\n        publishedAt: verifiedManifest.publishedAt,\n        publicKeyId: verifiedManifest.publicKeyId,"""
          new = """      if (!releaseNotes) {\n        releaseNotes = await this.fetchReleaseNotesForTag(releaseTag || `v${verifiedManifest.version}`);\n      }\n\n      this.state = 'available';\n      this.updateInfo = {\n        version: verifiedManifest.version,\n        channel: verifiedManifest.channel,\n        publishedAt: verifiedManifest.publishedAt,\n        releaseNotes,\n        publicKeyId: verifiedManifest.publicKeyId,"""
          if old not in text:
              raise SystemExit('UpdateInfo construction not found')
          updater.write_text(text.replace(old, new, 1))

          test_file = Path('test/desktop-updater-manifest.test.mjs')
          text = test_file.read_text()
          old = "import { DesktopUpdater, normalizePublicKey, validateCanonicalReleaseUrl } from '../desktop/updater.mjs';"
          new = "import { DesktopUpdater, MAX_RELEASE_NOTES_CHARS, normalizePublicKey, normalizeReleaseNotes, validateCanonicalReleaseUrl } from '../desktop/updater.mjs';"
          if old not in text:
              raise SystemExit('Updater test import not found')
          text = text.replace(old, new, 1)
          old_release = "{ tag_name: 'v1.2.0-beta.2', prerelease: true, draft: false },"
          new_release = "{ tag_name: 'v1.2.0-beta.2', prerelease: true, draft: false, body: '## What is new\\n- Proactive update checks' },"
          if old_release not in text:
              raise SystemExit('Beta release fixture not found')
          text = text.replace(old_release, new_release, 1)
          old_assert = """  assert.equal(status.state, 'available');\n  assert.equal(status.updateInfo.version, '1.2.0-beta.2');\n});"""
          new_assert = """  assert.equal(status.state, 'available');\n  assert.equal(status.updateInfo.version, '1.2.0-beta.2');\n  assert.match(status.updateInfo.releaseNotes, /Proactive update checks/);\n});\n\ntest('release notes are normalized and strictly bounded for display', () => {\n  assert.equal(normalizeReleaseNotes('  First\\r\\nSecond  '), 'First\\nSecond');\n  assert.equal(normalizeReleaseNotes('x'.repeat(MAX_RELEASE_NOTES_CHARS + 50)).length, MAX_RELEASE_NOTES_CHARS);\n  assert.equal(normalizeReleaseNotes(null), '');\n});"""
          if old_assert not in text:
              raise SystemExit('Beta release assertion block not found')
          test_file.write_text(text.replace(old_assert, new_assert, 1))

          status = Path('src/components/UpdaterStatus.tsx')
          text = status.read_text()
          anchor = """                <Typography.Text type=\"secondary\">\n                  Artifact: <code>{status.updateInfo.artifact.name}</code> ({formatBytes(status.updateInfo.artifact.size)})\n                  <br />\n                  Signature verified: Ed25519 (Key ID: {status.updateInfo.publicKeyId})\n                </Typography.Text>\n"""
          addition = """                {status.updateInfo.releaseNotes && <details className=\"update-release-notes\">\n                  <summary>What's new in this update</summary>\n                  <Typography.Paragraph style={{ whiteSpace: 'pre-wrap', margin: '8px 0 0' }}>\n                    {status.updateInfo.releaseNotes}\n                  </Typography.Paragraph>\n                </details>}\n"""
          if anchor not in text:
              raise SystemExit('UpdaterStatus release details anchor not found')
          status.write_text(text.replace(anchor, anchor + addition, 1))
          PY

          cat > src/components/UpdateAvailableNotifier.tsx <<'EOF'
          import { useEffect } from 'react';
          import { App as AntdApp, Button, Space, Typography } from 'antd';
          import type { QuizzerDesktopUpdaterApi, UpdaterStatus } from '../types/updater';

          const UPDATE_NOTIFICATION_KEY = 'quizzer-update-available';
          const UPDATE_CHECK_INTERVAL_MS = 30 * 60 * 1000;

          let updateCheck: Promise<UpdaterStatus | null> | undefined;
          let lastUpdateCheckAt = 0;

          const performUpdateCheck = async (updater: QuizzerDesktopUpdaterApi): Promise<UpdaterStatus> => {
            const current = await updater.getStatus();
            if (current.state === 'downloaded' || current.state === 'downloading' || current.state === 'applying' || current.state === 'installer-handoff-pending') {
              return current;
            }
            if (current.state === 'available') {
              return current.autoDownload ? updater.downloadUpdate() : current;
            }

            const now = Date.now();
            if (lastUpdateCheckAt && now - lastUpdateCheckAt < UPDATE_CHECK_INTERVAL_MS) return current;
            lastUpdateCheckAt = now;
            const checked = await updater.checkForUpdates();
            if (checked.state === 'available' && checked.autoDownload) return updater.downloadUpdate();
            return checked;
          };

          const checkForUpdates = (updater: QuizzerDesktopUpdaterApi) => {
            if (updateCheck) return updateCheck;
            updateCheck = performUpdateCheck(updater)
              .catch(() => null)
              .finally(() => { updateCheck = undefined; });
            return updateCheck;
          };

          const UpdateDescription = ({ status, lead }: { status: UpdaterStatus; lead: string }) => (
            <Space direction="vertical" size={4} style={{ maxWidth: 420 }}>
              <Typography.Text type="secondary">{lead}</Typography.Text>
              {status.updateInfo?.releaseNotes && <details className="update-release-notes">
                <summary>What's new in this update</summary>
                <Typography.Paragraph style={{ whiteSpace: 'pre-wrap', margin: '8px 0 0' }}>
                  {status.updateInfo.releaseNotes}
                </Typography.Paragraph>
              </details>}
            </Space>
          );

          interface Props {
            isTestActive: boolean;
            onOpenSettings: () => void;
          }

          export default function UpdateAvailableNotifier({ isTestActive, onOpenSettings }: Props) {
            const { notification } = AntdApp.useApp();

            useEffect(() => {
              if (isTestActive) {
                notification.destroy(UPDATE_NOTIFICATION_KEY);
                return;
              }
              const updater = window.quizzerDesktop?.updater;
              if (!updater) return;
              let active = true;

              const showReadyToInstall = (status: UpdaterStatus) => {
                if (!status.updateInfo) return;
                notification.success({
                  key: UPDATE_NOTIFICATION_KEY,
                  role: 'status',
                  duration: 0,
                  placement: 'bottomLeft',
                  message: `Quizzer ${status.updateInfo.version} is ready to install`,
                  description: <UpdateDescription status={status} lead="The signed update was downloaded and verified. Quizzer will restart after installation." />,
                  actions: <Space>
                    <Button size="small" onClick={onOpenSettings}>Settings</Button>
                    <Button type="primary" size="small" onClick={() => {
                      notification.destroy(UPDATE_NOTIFICATION_KEY);
                      void updater.applyUpdate({ restart: true }).catch(error => {
                        if (!active) return;
                        notification.error({
                          key: UPDATE_NOTIFICATION_KEY,
                          message: 'Quizzer could not install the update',
                          description: error instanceof Error ? error.message : String(error),
                          duration: 0,
                          placement: 'bottomLeft',
                        });
                      });
                    }}>Install and restart</Button>
                  </Space>,
                });
              };

              const showAvailable = (status: UpdaterStatus) => {
                if (!status.updateInfo) return;
                notification.info({
                  key: UPDATE_NOTIFICATION_KEY,
                  role: 'status',
                  duration: 0,
                  placement: 'bottomLeft',
                  message: `Quizzer ${status.updateInfo.version} is available`,
                  description: <UpdateDescription status={status} lead="Automatic downloads are off. Download the signed update when you are ready." />,
                  actions: <Space>
                    <Button size="small" onClick={onOpenSettings}>Settings</Button>
                    <Button type="primary" size="small" onClick={() => {
                      notification.destroy(UPDATE_NOTIFICATION_KEY);
                      void updater.downloadUpdate().then(downloaded => {
                        if (active && !isTestActive) showReadyToInstall(downloaded);
                      }).catch(error => {
                        if (!active) return;
                        notification.error({
                          key: UPDATE_NOTIFICATION_KEY,
                          message: 'Quizzer could not download the update',
                          description: error instanceof Error ? error.message : String(error),
                          duration: 0,
                          placement: 'bottomLeft',
                        });
                      });
                    }}>Download update</Button>
                  </Space>,
                });
              };

              const surfaceStatus = (status: UpdaterStatus | null) => {
                if (!active || isTestActive || !status) return;
                if (status.state === 'downloaded') showReadyToInstall(status);
                else if (status.state === 'available') showAvailable(status);
              };

              const refresh = () => { void checkForUpdates(updater).then(surfaceStatus); };
              const onVisibilityChange = () => { if (document.visibilityState === 'visible') refresh(); };

              refresh();
              window.addEventListener('focus', refresh);
              document.addEventListener('visibilitychange', onVisibilityChange);
              const interval = window.setInterval(refresh, UPDATE_CHECK_INTERVAL_MS);

              return () => {
                active = false;
                window.removeEventListener('focus', refresh);
                document.removeEventListener('visibilitychange', onVisibilityChange);
                window.clearInterval(interval);
              };
            }, [isTestActive, notification, onOpenSettings]);

            return null;
          }
          EOF

          cat > test/update-notifier-source.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          test('desktop notifier checks proactively and exposes expandable release notes', async () => {
            const source = await readFile(new URL('../src/components/UpdateAvailableNotifier.tsx', import.meta.url), 'utf8');
            assert.doesNotMatch(source, /sessionStorage/);
            assert.match(source, /window\.addEventListener\('focus', refresh\)/);
            assert.match(source, /document\.addEventListener\('visibilitychange', onVisibilityChange\)/);
            assert.match(source, /window\.setInterval\(refresh, UPDATE_CHECK_INTERVAL_MS\)/);
            assert.match(source, /<details className="update-release-notes">/);
            assert.match(source, /What's new in this update/);
          });
          EOF

          npm run lint
          npm test -- --test-name-pattern='release notes|desktop notifier'
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/patch-issue-137.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/updater.mjs src/types/updater.ts src/components/UpdateAvailableNotifier.tsx src/components/UpdaterStatus.tsx test/desktop-updater-manifest.test.mjs test/update-notifier-source.test.mjs .github/workflows/patch-issue-137.yml
          git commit -m 'fix(updater): proactively surface new releases'
          git push origin HEAD:fix/issue-137-proactive-updates
