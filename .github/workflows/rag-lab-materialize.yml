name: Materialize RAG lab PDFs
on:
  push:
    branches: [feat/course-benchmark-dataset]
    paths:
      - scripts/acquire-rag-lab.py
      - scripts/build-rag-lab.py
      - .github/workflows/rag-lab-materialize.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rag-lab-materialize
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'longnt27/quizzer' && github.ref == 'refs/heads/feat/course-benchmark-dataset'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf==5.9.0 reportlab==4.4.9 pypdfium2==5.8.0 Pillow==12.3.0
      - name: Acquire licensed original PDFs and byte fingerprints
        run: python scripts/acquire-rag-lab.py --acknowledge-noncommercial-source-terms
      - name: Build original controlled documents when the generator is present
        run: |
          if test -f scripts/build-rag-lab.py; then
            python scripts/build-rag-lab.py
          fi
      - name: Test benchmark data tools
        run: python -m unittest discover -s test -p 'test_rag_lab_*.py'
      - name: Commit only benchmark artifacts to the requested feature branch
        run: |
          git add eval/rag-lab
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(eval): materialize inspectable PDF corpus and generated benchmark artifacts'
          git push origin HEAD:refs/heads/feat/course-benchmark-dataset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-lab-materialization-report
          path: |
            eval/rag-lab/corpus/sources.json
            eval/rag-lab/corpus/acquisition-report.json
            eval/rag-lab/controlled/manifest.json
          if-no-files-found: warn
