name: Apply issue 167 validation patch
on:
  push:
    branches: [fix/issue-167-prompt-type-instructions]
    paths: [.github/workflows/issue-167-snapshot-validation-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-167-prompt-type-instructions
      - run: python scripts/issue-167-snapshot-validation-fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(generation): validate prompt type instruction snapshots"
          git push origin HEAD:fix/issue-167-prompt-type-instructions
